<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма обратной связи</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Форма обратной связи</h1>
    <p class="subtitle">Заполните поля и нажмите кнопку отправки</p>

    <form id="contact-form" novalidate>
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" placeholder="Введите имя" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="example@mail.ru" required>

      <label for="message">Сообщение</label>
      <textarea id="message" name="message" rows="4" placeholder="Ваше сообщение" required></textarea>

      <button id="submit-btn" type="submit">Отправить</button>
    </form>

    <p id="success-message" class="message success hidden" role="status">
      Спасибо! Форма успешно отправлена.
    </p>
    <p id="error-message" class="message error hidden" role="alert">
      Пожалуйста, заполните все поля корректно.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
